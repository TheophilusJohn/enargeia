<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>enargeia — kernel bench</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #05050a;
        --surface: #0e0e16;
        --line: #1c1c29;
        --ink: #f5f5fa;
        --dim: #9a9ab4;
        --k2: #ffd52e;
        --k3: #3ddc6b;
        --k4: #1fd4e8;
        --k0: #ff4757;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 48px 24px 96px;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/1.6 "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      main { max-width: 820px; margin: 0 auto; }
      h1 { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 6px; }
      .sub { color: var(--dim); margin: 0 0 40px; }
      section { margin-bottom: 36px; }
      h2 {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 0 0 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
      td:first-child { color: var(--dim); width: 52%; padding-right: 16px; }
      td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
      .pass { color: var(--k3); }
      .fail { color: var(--k0); }
      .note { color: var(--dim); }
      .headline {
        font-size: 34px;
        letter-spacing: -0.02em;
        color: var(--k2);
        font-variant-numeric: tabular-nums;
        margin: 0 0 8px;
      }
      button {
        font: inherit;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 9px 18px;
        cursor: pointer;
        letter-spacing: 0.06em;
      }
      button:hover:not(:disabled) { border-color: var(--k4); }
      button:disabled { opacity: 0.4; cursor: default; }
      button:focus-visible { outline: 2px solid var(--k4); outline-offset: 2px; }
      pre { margin: 0; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kernel bench</h1>
      <p class="sub">
        Correctness first, then throughput. Append <code>?clampStorage</code> to force the
        128 MiB storage-binding path; <code>?n=512</code> to change the matmul size.
      </p>

      <section id="device"><h2>Device</h2><p class="note">probing…</p></section>
      <section id="correctness"><h2>Correctness</h2><p class="note">waiting on device…</p></section>
      <section id="throughput">
        <h2>Throughput</h2>
        <button id="run" disabled>Run benchmark</button>
        <div id="throughput-out" style="margin-top: 16px"></div>
      </section>
      <section id="resources"><h2>Resources</h2></section>
    </main>
    <script type="module" src="/src/bench/main.ts"></script>
  </body>
</html>
